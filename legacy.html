      card.querySelector('.info-btn').addEventListener('click', () => openExerciseDetail(ex));
      card.querySelector('.chart-btn').addEventListener('click', () => openStrengthChart(day, ex));

      const prev = lastSession(day.id, ex.id);
      const rec = recommendNext(day, ex);
      if (rec) {
        const slot = card.querySelector('.suggestion-slot');
        slot.innerHTML = `<div class="suggestion ${rec.kind === 'reduce' ? 'warn' : ''}"><div class="suggestion-title">Suggested next time</div><div class="suggestion-main"></div><div class="suggestion-note"></div></div>`;
        slot.querySelector('.suggestion-main').textContent = rec.main;
        slot.querySelector('.suggestion-note').textContent = rec.note;
      }

      if (prev && Array.isArray(prev.sets) && prev.sets.length) {
        const lastSlot = card.querySelector('.last-session-slot');
        const strip = document.createElement('div');
        strip.className = 'last-session';
        strip.innerHTML = `<div class="last-session-label">Last · ${escapeXml(formatDateShort(prev.date))}</div><div class="last-session-sets"></div>`;
        const setsWrap = strip.querySelector('.last-session-sets');
        prev.sets.forEach((set, index) => {
          const chip = document.createElement('div');
          chip.className = 'last-set-chip';
          const flags = `${set.failure ? '<span class="last-mini-flag failure">F</span>' : ''}${set.dropset ? '<span class="last-mini-flag dropset">DS</span>' : ''}`;
          chip.innerHTML = `<span class="last-set-number">${index + 1}</span><span class="last-set-value">${formatWeight(Number(set.weight))}×${Number(set.reps) || '—'}</span>${flags}`;
          setsWrap.appendChild(chip);
        });
        lastSlot.appendChild(strip);
      }

      const tbody = card.querySelector('tbody');
      const sets = exerciseSets(day.id, ex.id);
      const redrawRows = () => {
        tbody.innerHTML = '';
        sets.forEach((set, index) => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td class="set-number">${index + 1}</td>
            <td><input class="set-input weight-input" inputmode="decimal" placeholder="${cfg.loadType === 'assistance' ? 'assist kg' : 'kg'}" aria-label="${cfg.loadType === 'assistance' ? 'Assistance' : 'Weight'} for set ${index + 1}"></td>
            <td><input class="set-input reps-input" inputmode="numeric" placeholder="reps" aria-label="Reps for set ${index + 1}"></td>
            <td><div class="set-flags"><button class="flag-btn failure-btn ${set.failure ? 'active' : ''}" aria-label="Toggle failure for set ${index + 1}">F</button><button class="flag-btn dropset-btn ${set.dropset ? 'active' : ''}" aria-label="Toggle drop set for set ${index + 1}">DS</button></div></td>`;
          const weight = row.querySelector('.weight-input');
          const reps = row.querySelector('.reps-input');
          const failure = row.querySelector('.failure-btn');
          const dropset = row.querySelector('.dropset-btn');
          weight.value = set.weight;
          reps.value = set.reps;
          weight.addEventListener('input', () => { set.weight = weight.value; saveData(); });
          reps.addEventListener('input', () => { set.reps = reps.value; saveData(); });
          failure.addEventListener('click', () => { set.failure = !set.failure; failure.classList.toggle('active', set.failure); saveData(); });
          dropset.addEventListener('click', () => { set.dropset = !set.dropset; dropset.classList.toggle('active', set.dropset); saveData(); });
          tbody.appendChild(row);
        });
      };
      card.querySelector('.add-set-btn').addEventListener('click', () => { sets.push({weight:'',reps:'',failure:false,dropset:false}); saveData(); redrawRows(); });
      card.querySelector('.remove-set-btn').addEventListener('click', () => { if (sets.length > 1) { sets.pop(); saveData(); redrawRows(); } });
      redrawRows();
      return card;
    }

    function finishWorkout(dayId) {
      const day = data.days.find(d => d.id === dayId);
      if (!day) return;
      const log = dayLog(dayId);
      const hasAnything = day.exercises.some(ex => completedSets(log[ex.id] || []).length > 0);
      if (!hasAnything) { alert('Enter at least one completed set before finishing the workout.'); return; }
      if (!data.history[dayId]) data.history[dayId] = {};
      const timestamp = new Date().toISOString();
      day.exercises.forEach(ex => {
        const sets = log[ex.id] || [];
        const completed = completedSets(sets);
        if (!completed.length) return;
        if (!data.history[dayId][ex.id]) data.history[dayId][ex.id] = [];
        data.history[dayId][ex.id].push({
          date: timestamp,
          sets: completed.map(s => ({ weight: s.weight, reps: s.reps, failure: s.failure, dropset: s.dropset }))
        });
        if (data.history[dayId][ex.id].length > 30) data.history[dayId][ex.id].shift();
        log[ex.id] = Array.from({length: completed.length}, () => ({weight:'',reps:'',failure:false,dropset:false}));
      });
      saveData();
      renderWorkout(dayId);
      window.scrollTo({top:0,behavior:'smooth'});
    }

    function openSettings() { renderSettings(); document.getElementById('settingsBackdrop').classList.add('open'); }
    function closeSettings() { document.getElementById('settingsBackdrop').classList.remove('open'); if (currentDayId) renderWorkout(currentDayId); else renderHome(); }

    function renderSettings() {
      const wrap = document.getElementById('settingsContent');
      wrap.innerHTML = `
        <div class="sound-settings-card">
          <div class="sound-settings-title">Calm sound</div>
          <div class="sound-settings-note">Choose what the speaker button plays. Brown noise is the default because no single “healing frequency” is proven to stop overthinking.</div>
          <select class="sound-mode-select" id="soundModeSelect" aria-label="Calm sound mode">
            <option value="brown">Brown noise — default</option>
            <option value="binaural10">10 Hz binaural beat — headphones</option>
            <option value="tone852">852 Hz pure tone — preference only</option>
          </select>
          <div class="sound-state-note">Starts at a low app level. Use your iPhone volume at a comfortable level. 10 Hz binaural mode uses 200 Hz in one ear and 210 Hz in the other.</div>
        </div>`;
      const soundSelect = document.getElementById('soundModeSelect');
      soundSelect.value = data.soundMode || 'brown';
      soundSelect.addEventListener('change', async () => {
        const wasOn = calmSoundOn;
        data.soundMode = soundSelect.value;
        saveData();
        if (wasOn) await startCalmSound();
        updateCalmSoundButton();
      });
      if (!data.days.length) wrap.insertAdjacentHTML('beforeend', '<div class="empty" style="margin-bottom:12px">Add your first workout day below.</div>');

      data.days.forEach(day => {
        const card = document.createElement('div');
        card.className = 'settings-card';
        const top = document.createElement('div');
        top.className = 'settings-row';
        top.innerHTML = `<input class="settings-input day-name-input" aria-label="Workout day name"><button class="danger-btn delete-day-btn">Delete</button>`;
        const dayInput = top.querySelector('.day-name-input');
        dayInput.value = day.name;
        dayInput.addEventListener('input', () => { day.name = dayInput.value || 'Untitled workout'; saveData(); });
        top.querySelector('.delete-day-btn').addEventListener('click', () => {
          data.days = data.days.filter(d => d.id !== day.id); delete data.logs[day.id]; delete data.history[day.id]; if (currentDayId === day.id) currentDayId = null; saveData(); renderSettings();
        });
        card.appendChild(top);

        const label = document.createElement('div'); label.className = 'section-label'; label.textContent = 'Exercises'; card.appendChild(label);
        const exerciseWrap = document.createElement('div'); exerciseWrap.className = 'exercise-settings';
        day.exercises.forEach(ex => {
          const cfg = exerciseConfig(ex);
          const row = document.createElement('div');
          row.innerHTML = `
            <div class="settings-row">
              <input class="settings-input exercise-name-input" aria-label="Exercise name">
              <button class="small-btn info-setting-btn">i</button>
              <button class="small-btn remove-exercise-btn">×</button>
            </div>
            <div class="settings-row">
              <input class="settings-input settings-number min-input" inputmode="numeric" aria-label="Minimum reps" placeholder="Min">
              <span style="color:var(--muted)">to</span>
              <input class="settings-input settings-number max-input" inputmode="numeric" aria-label="Maximum reps" placeholder="Max">
              <input class="settings-input settings-number inc-input" inputmode="decimal" aria-label="Weight increment" placeholder="kg step">
            </div>`;
          const exInput = row.querySelector('.exercise-name-input'); exInput.value = ex.name;
          exInput.addEventListener('change', () => {
            ex.name = exInput.value || 'Untitled exercise';
            const matched = matchLibrary(ex.name);
            ex.libraryId = matched ? matched.id : null;
            if (matched) ex.increment = matched.increment;
            saveData(); renderSettings();
          });
          const minInput = row.querySelector('.min-input'); const maxInput = row.querySelector('.max-input'); const incInput = row.querySelector('.inc-input');
          minInput.value = cfg.min; maxInput.value = cfg.max; incInput.value = cfg.increment;
          minInput.addEventListener('change', () => { const v = Number(minInput.value); ex.customMin = Number.isFinite(v) && v > 0 ? v : null; saveData(); renderSettings(); });
          maxInput.addEventListener('change', () => { const v = Number(maxInput.value); ex.customMax = Number.isFinite(v) && v > 0 ? v : null; saveData(); renderSettings(); });
          incInput.addEventListener('change', () => { const v = Number(incInput.value); if (Number.isFinite(v) && v >= 0) ex.increment = v; saveData(); renderSettings(); });
          row.querySelector('.info-setting-btn').addEventListener('click', () => openExerciseDetail(ex));
          row.querySelector('.remove-exercise-btn').addEventListener('click', () => {
            day.exercises = day.exercises.filter(e => e.id !== ex.id); if (data.logs[day.id]) delete data.logs[day.id][ex.id]; if (data.history[day.id]) delete data.history[day.id][ex.id]; saveData(); renderSettings();
          });
          exerciseWrap.appendChild(row);
        });

        const actions = document.createElement('div'); actions.className = 'picker-actions';
        const addLibrary = document.createElement('button'); addLibrary.className = 'small-btn'; addLibrary.textContent = '+ From library';
        addLibrary.addEventListener('click', () => { pickerDayId = day.id; openLibrary('pick'); });
        const addCustom = document.createElement('button'); addCustom.className = 'small-btn'; addCustom.textContent = '+ Custom';
        addCustom.addEventListener('click', () => { day.exercises.push({id:cryptoId(),name:'New Exercise',libraryId:null,increment:2.5,customMin:6,customMax:12}); saveData(); renderSettings(); });
        actions.append(addLibrary, addCustom); exerciseWrap.appendChild(actions);
        card.appendChild(exerciseWrap); wrap.appendChild(card);
      });
    }

    function openLibrary(mode = 'browse') {
      libraryMode = mode;
      document.getElementById('libraryTitle').textContent = mode === 'pick' ? 'Choose exercise' : 'Exercise library';
      renderLibraryList('');
      document.getElementById('libraryBackdrop').classList.add('open');
    }

    function closeLibrary() { document.getElementById('libraryBackdrop').classList.remove('open'); libraryMode = 'browse'; pickerDayId = null; }

    function renderLibraryList(query) {
      const content = document.getElementById('libraryContent');
      content.innerHTML = `<input class="library-search" id="librarySearch" placeholder="Search exercises or muscles"><div class="library-list" id="libraryList"></div>`;
      const search = content.querySelector('#librarySearch'); search.value = query;
      search.addEventListener('input', () => renderLibraryResults(search.value));
      renderLibraryResults(query);
      setTimeout(() => { if (libraryMode === 'pick') search.focus(); }, 50);
    }

    function renderLibraryResults(query) {
      const list = document.getElementById('libraryList');
      if (!list) return;
      const q = normalizeName(query);
      const matches = EXERCISE_LIBRARY.filter(item => {
        const hay = normalizeName([item.name,item.category,...item.primary,...item.secondary,...simpleMuscles(item,'primary'),...simpleMuscles(item,'secondary'),...(item.aliases||[])].join(' '));
        return !q || hay.includes(q);
      });
      list.innerHTML = '';
      if (!matches.length) { list.innerHTML = '<div class="empty">No matching exercises.</div>'; return; }
      matches.forEach(item => {
        const btn = document.createElement('button'); btn.className = 'library-item';
        btn.innerHTML = `<div class="library-item-name"></div><div class="library-item-meta"></div>`;
        btn.querySelector('.library-item-name').textContent = item.name;
        btn.querySelector('.library-item-meta').textContent = `${item.min}–${item.max} reps • ${item.category} • Primary: ${simpleMuscles(item, 'primary').join(', ')}`;
        btn.addEventListener('click', () => {
          if (libraryMode === 'pick') addLibraryExerciseToDay(item);
          else showLibraryDetail(item);
        });
        list.appendChild(btn);
      });
    }

    function addLibraryExerciseToDay(item) {
      const day = data.days.find(d => d.id === pickerDayId);
      if (!day) return closeLibrary();
      day.exercises.push({id:cryptoId(),name:item.name,libraryId:item.id,increment:item.increment,customMin:null,customMax:null});
      saveData(); closeLibrary(); renderSettings();
    }

    function openExerciseDetail(ex) {
      const lib = getLibraryForExercise(ex);
      document.getElementById('libraryTitle').textContent = ex.name;
      const content = document.getElementById('libraryContent');
      if (!lib) {
        const cfg = exerciseConfig(ex);
        content.innerHTML = `<div class="detail-card"><div class="detail-label">Custom exercise</div><div class="detail-value">Working range: ${cfg.min}–${cfg.max} reps</div><div class="evidence-note">This exercise is not matched to the built-in library, so primary and secondary muscle information is not assigned automatically.</div></div>`;
      } else renderDetailContent(content, lib, ex);
      document.getElementById('libraryBackdrop').classList.add('open');
    }

    function showLibraryDetail(lib) {
      document.getElementById('libraryTitle').textContent = lib.name;
      const content = document.getElementById('libraryContent');
      renderDetailContent(content, lib, null);
    }

    function renderDetailContent(content, lib, ex) {
      const cfg = ex ? exerciseConfig(ex) : {min:lib.min,max:lib.max,increment:lib.increment};
      content.innerHTML = `
        <div class="detail-card"><div class="detail-label">Practical hypertrophy range</div><div class="detail-value">${cfg.min}–${cfg.max} reps per working set</div><div class="evidence-note">This is a practical progression range for this exercise, not a claim that muscle only grows inside these exact reps.</div></div>
        <div class="detail-card"><div class="detail-label">Primary muscles</div><div class="detail-value" id="primaryMuscles"></div></div>
        <div class="detail-card"><div class="detail-label">Secondary muscles</div><div class="detail-value" id="secondaryMuscles"></div></div>
        <div class="detail-card"><div class="detail-label">Default weight step</div><div class="detail-value">${formatWeight(cfg.increment)} kg</div></div>
        <div class="detail-card"><div class="detail-label">Training note</div><div class="detail-value" id="trainingNote"></div></div>
        <button class="small-btn" style="width:100%" id="backToLibrary">← Back to library</button>`;
      const primarySimple = simpleMuscles(lib, 'primary');
      const secondarySimple = simpleMuscles(lib, 'secondary');
      content.querySelector('#primaryMuscles').textContent = primarySimple.length ? primarySimple.join(', ') : '—';
      content.querySelector('#secondaryMuscles').textContent = secondarySimple.length ? secondarySimple.join(', ') : '—';
      content.querySelector('#trainingNote').textContent = lib.note;
      content.querySelector('#backToLibrary').addEventListener('click', () => { document.getElementById('libraryTitle').textContent = 'Exercise library'; libraryMode = 'browse'; renderLibraryList(''); });
    }

    document.getElementById('settingsFab').addEventListener('click', openSettings);
    document.getElementById('libraryFab').addEventListener('click', () => openLibrary('browse'));
    document.getElementById('closeSettings').addEventListener('click', closeSettings);
    document.getElementById('closeLibrary').addEventListener('click', closeLibrary);
    document.getElementById('closeStrength').addEventListener('click', closeStrengthChart);
    document.getElementById('closeVolume').addEventListener('click', closeWeeklyVolume);
    document.getElementById('closeHabits').addEventListener('click', closeHabits);
    document.getElementById('closeQuote').addEventListener('click', closeQuoteGenerator);
    document.getElementById('newQuoteBtn').addEventListener('click', showAnotherQuote);
    document.getElementById('settingsBackdrop').addEventListener('click', e => { if (e.target.id === 'settingsBackdrop') closeSettings(); });
    document.getElementById('libraryBackdrop').addEventListener('click', e => { if (e.target.id === 'libraryBackdrop') closeLibrary(); });
    document.getElementById('strengthBackdrop').addEventListener('click', e => { if (e.target.id === 'strengthBackdrop') closeStrengthChart(); });
    document.getElementById('volumeBackdrop').addEventListener('click', e => { if (e.target.id === 'volumeBackdrop') closeWeeklyVolume(); });
    document.getElementById('habitsBackdrop').addEventListener('click', e => { if (e.target.id === 'habitsBackdrop') closeHabits(); });
    document.getElementById('quoteBackdrop').addEventListener('click', e => { if (e.target.id === 'quoteBackdrop') closeQuoteGenerator(); });
    document.getElementById('addDayBtn').addEventListener('click', () => { data.days.push({id:cryptoId(),name:'New Workout',exercises:[]}); saveData(); renderSettings(); });

    saveData();
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && calmSoundOn) stopCalmSound();
    });
    window.addEventListener('pagehide', stopCalmSound);

    renderHome();
  </script>
</body>
</html>
