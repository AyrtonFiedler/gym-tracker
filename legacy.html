<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#f7f1e5" />
  <title>Gym Tracker</title>
  <style>
    :root {
      --bg: #f5f5f7;
      --card: #ffffff;
      --text: #171717;
      --muted: #757575;
      --line: #dedede;
      --accent: #171717;
      --soft: #f0f0f2;
      --danger: #b42318;
      --good: #166534;
      --good-bg: #f0fdf4;
      --warn-bg: #fff8e7;
      --warn: #8a5a00;
      --radius: 16px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    .app { width: min(100%, 720px); margin: 0 auto; min-height: 100vh; padding: 24px 16px calc(96px + var(--safe-bottom)); }
    .header { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
    .header h1 { font-size: 28px; line-height: 1.1; margin: 0; font-weight: 750; letter-spacing: -0.5px; }
    .back-btn { border: 0; background: transparent; width: 40px; height: 40px; padding: 0; border-radius: 12px; font-size: 27px; cursor: pointer; }
    .subtitle { color: var(--muted); margin: 5px 0 0; font-size: 14px; }

    .day-list { display: grid; grid-template-columns: 1fr; gap: 12px; }
    .day-btn { width: 100%; min-height: 72px; border: 1px solid var(--line); background: var(--card); border-radius: var(--radius); padding: 18px; text-align: left; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.035); display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .day-btn:active { transform: scale(.995); }
    .day-name { font-size: 18px; font-weight: 700; }
    .day-count { font-size: 13px; color: var(--muted); white-space: nowrap; }

    .exercise-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 14px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.03); }
    .exercise-head { padding: 14px 14px 10px; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .exercise-title { font-weight: 750; font-size: 16px; }
    .exercise-meta { color: var(--muted); font-size: 12px; margin-top: 4px; line-height: 1.35; }
    .info-btn { border: 1px solid var(--line); background: #fafafa; color: var(--text); width: 32px; height: 32px; border-radius: 10px; font-weight: 750; cursor: pointer; flex: 0 0 auto; }

    .suggestion { margin: 0 12px 12px; border-radius: 12px; padding: 10px 11px; border: 1px solid #d9e6dc; background: var(--good-bg); }
    .suggestion.warn { background: var(--warn-bg); border-color: #f0dfad; }
    .suggestion-title { font-size: 11px; text-transform: uppercase; letter-spacing: .35px; font-weight: 800; color: var(--good); margin-bottom: 4px; }
    .suggestion.warn .suggestion-title { color: var(--warn); }
    .suggestion-main { font-size: 14px; font-weight: 750; line-height: 1.35; }
    .suggestion-note { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.35; }

    .last-session { margin: -2px 12px 10px; display: flex; align-items: center; gap: 7px; min-width: 0; }
    .last-session-label { flex: 0 0 auto; color: var(--muted); font-size: 10px; font-weight: 750; white-space: nowrap; }
    .last-session-sets { display: flex; gap: 5px; min-width: 0; overflow-x: auto; scrollbar-width: none; padding: 1px 0; }
    .last-session-sets::-webkit-scrollbar { display: none; }
    .last-set-chip { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 4px; min-height: 25px; padding: 3px 7px; border: 1px solid var(--line); border-radius: 8px; background: #fafafa; font-size: 11px; color: #555; white-space: nowrap; }
    .last-set-number { color: var(--muted); font-size: 9px; font-weight: 800; }
    .last-set-value { font-weight: 700; color: var(--text); }
    .last-mini-flag { font-size: 8px; font-weight: 850; color: var(--muted); }
    .last-mini-flag.failure { color: var(--accent); }
    .last-mini-flag.dropset { color: #555; }

    .set-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    .set-table th, .set-table td { border-top: 1px solid var(--line); padding: 8px 6px; text-align: center; vertical-align: middle; }
    .set-table th { color: var(--muted); font-size: 11px; font-weight: 650; background: #fafafa; text-transform: uppercase; letter-spacing: .3px; }
    .set-number { width: 44px; color: var(--muted); font-size: 14px; }
    .flags-col { width: 118px; }
    .set-input { width: 100%; min-width: 0; height: 39px; border: 1px solid var(--line); border-radius: 10px; background: #fff; padding: 7px 8px; text-align: center; outline: none; font-size: 16px; }
    .set-input:focus { border-color: #8c8c8c; }
    .set-flags { display: flex; justify-content: center; gap: 5px; }
    .flag-btn { width: 42px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: white; color: var(--muted); font-size: 11px; font-weight: 800; cursor: pointer; padding: 0; }
    .flag-btn.active { background: var(--accent); border-color: var(--accent); color: white; }
    .dropset-btn.active { background: #555; border-color: #555; }
    .exercise-footer { display: flex; gap: 8px; padding: 10px 12px 12px; border-top: 1px solid var(--line); }
    .add-set-btn { border: 1px solid var(--line); background: #fafafa; border-radius: 11px; padding: 9px 12px; font-weight: 700; cursor: pointer; }
    .remove-set-btn { border: 0; background: transparent; color: var(--muted); border-radius: 10px; padding: 9px 10px; cursor: pointer; }

    .finish-btn { width: 100%; border: 0; background: var(--accent); color: white; border-radius: 14px; min-height: 50px; font-weight: 800; margin: 4px 0 16px; cursor: pointer; }
    .finish-note { text-align: center; color: var(--muted); font-size: 12px; margin: -6px 8px 16px; }

    .settings-fab { position: fixed; left: max(16px, env(safe-area-inset-left)); bottom: calc(16px + var(--safe-bottom)); width: 48px; height: 48px; border-radius: 15px; border: 1px solid var(--line); background: rgba(255,255,255,.94); backdrop-filter: blur(8px); font-size: 23px; cursor: pointer; box-shadow: 0 4px 18px rgba(0,0,0,.08); z-index: 20; }
    .library-fab { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: calc(16px + var(--safe-bottom)); height: 48px; border-radius: 15px; border: 1px solid var(--line); background: rgba(255,255,255,.94); backdrop-filter: blur(8px); padding: 0 14px; font-weight: 750; cursor: pointer; box-shadow: 0 4px 18px rgba(0,0,0,.08); z-index: 20; }

    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.28); display: none; align-items: flex-end; justify-content: center; z-index: 50; }
    .modal-backdrop.open { display: flex; }
    .modal { width: min(100%, 720px); max-height: 88vh; overflow: auto; background: var(--bg); border-radius: 24px 24px 0 0; padding: 18px 16px calc(24px + var(--safe-bottom)); box-shadow: 0 -8px 30px rgba(0,0,0,.16); }
    .modal-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; }
    .modal h2 { margin: 0; font-size: 22px; }
    .close-btn { border: 1px solid var(--line); background: white; width: 38px; height: 38px; border-radius: 12px; font-size: 20px; cursor: pointer; }

    .settings-card { background: white; border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; margin-bottom: 12px; }
    .settings-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    .settings-row:last-child { margin-bottom: 0; }
    .settings-input { flex: 1; min-width: 0; height: 42px; border: 1px solid var(--line); border-radius: 11px; padding: 8px 10px; font-size: 16px; outline: none; }
    .settings-number { width: 82px; flex: 0 0 82px; }
    .small-btn, .primary-btn, .danger-btn { border-radius: 11px; min-height: 40px; padding: 8px 12px; cursor: pointer; font-weight: 700; }
    .small-btn { border: 1px solid var(--line); background: #fafafa; }
    .primary-btn { width: 100%; border: 0; background: var(--accent); color: white; margin-top: 4px; }
    .danger-btn { border: 1px solid #f0c7c2; color: var(--danger); background: #fff7f6; }
    .exercise-settings { margin-left: 12px; padding-left: 12px; border-left: 2px solid #ededed; margin-top: 8px; }
    .section-label { color: var(--muted); font-size: 12px; font-weight: 700; margin: 10px 0 7px; text-transform: uppercase; letter-spacing: .35px; }
    .empty { background: white; border: 1px dashed #cfcfcf; border-radius: var(--radius); text-align: center; color: var(--muted); padding: 30px 18px; }

    .library-search { width: 100%; height: 44px; border: 1px solid var(--line); border-radius: 12px; background: white; padding: 9px 12px; font-size: 16px; margin-bottom: 12px; outline: none; }
    .library-list { display: grid; gap: 8px; }
    .library-item { border: 1px solid var(--line); background: white; border-radius: 13px; padding: 12px; cursor: pointer; text-align: left; }
    .library-item-name { font-weight: 750; font-size: 15px; }
    .library-item-meta { color: var(--muted); font-size: 12px; margin-top: 3px; line-height: 1.35; }
    .detail-card { background: white; border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; }
    .detail-label { color: var(--muted); font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .35px; margin-bottom: 4px; }
    .detail-value { font-size: 15px; line-height: 1.4; }
    .evidence-note { color: var(--muted); font-size: 12px; line-height: 1.45; margin-top: 8px; }

    .exercise-actions { display: flex; gap: 6px; flex: 0 0 auto; }
    .chart-btn { border: 1px solid var(--line); background: #fafafa; color: var(--text); height: 32px; border-radius: 10px; font-weight: 750; cursor: pointer; padding: 0 9px; font-size: 12px; }
    .strength-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
    .strength-stat { background: white; border: 1px solid var(--line); border-radius: 13px; padding: 10px; min-width: 0; }
    .strength-stat-label { color: var(--muted); font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .3px; margin-bottom: 4px; }
    .strength-stat-value { font-size: 18px; font-weight: 800; line-height: 1.15; }
    .strength-stat-sub { color: var(--muted); font-size: 11px; margin-top: 3px; }
    .strength-positive { color: var(--good); }
    .strength-negative { color: var(--danger); }
    .chart-card { background: white; border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; overflow: hidden; }
    .chart-wrap { width: 100%; overflow: hidden; }
    .strength-svg { width: 100%; height: auto; display: block; }
    .chart-grid { stroke: #e8e8e8; stroke-width: 1; }
    .chart-axis-text { fill: #777; font-size: 11px; }
    .chart-line { fill: none; stroke: #171717; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .chart-dot { fill: #fff; stroke: #171717; stroke-width: 2.5; }
    .chart-dot.latest { fill: #171717; }
    .chart-note { color: var(--muted); font-size: 12px; line-height: 1.45; margin-top: 10px; }
    .history-mini { margin-top: 10px; display: grid; gap: 6px; }
    .history-row { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; border-top: 1px solid #ededed; padding-top: 7px; }
    .history-row span:last-child { font-weight: 700; text-align: right; }

    .home-header { justify-content: space-between; }
    .home-actions { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
    .home-icon-btn, .volume-icon-btn { flex: 0 0 auto; width: 42px; height: 42px; border: 1px solid var(--line); background: var(--card); border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text); padding: 0; box-shadow: 0 1px 2px rgba(0,0,0,.035); }
    .home-icon-btn svg, .volume-icon-btn svg { width: 21px; height: 21px; display: block; }
    .quote-stage { min-height: 230px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 28px 18px 24px; border: 1px solid var(--line); background: white; border-radius: var(--radius); }
    .quote-text { margin: 0; max-width: 520px; font-size: clamp(24px, 7vw, 38px); line-height: 1.08; font-weight: 850; letter-spacing: -1px; }
    .quote-controls { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 10px; }
    .quote-hint { color: var(--muted); font-size: 11px; line-height: 1.4; text-align: center; margin-top: 9px; padding: 0 10px; }

    .home-quote { margin: 2px 2px 24px; padding: 10px 4px 2px; text-align: left; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; }
    .home-quote-text { margin: 0; max-width: 650px; font-size: clamp(27px, 7.5vw, 42px); line-height: 1.03; font-weight: 860; letter-spacing: -1.25px; text-wrap: balance; }
    .home-quote-hint { margin-top: 9px; color: var(--muted); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .75px; }
    .home-quote:active .home-quote-text { opacity: .7; }
    .week-nav { display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; gap: 8px; margin-bottom: 12px; }
    .week-nav-btn { width: 40px; height: 38px; border: 1px solid var(--line); background: white; border-radius: 11px; cursor: pointer; font-size: 20px; }
    .week-nav-btn:disabled { opacity: .3; cursor: default; }
    .week-label { text-align: center; min-width: 0; }
    .week-label-main { font-size: 14px; font-weight: 800; }
    .week-label-sub { color: var(--muted); font-size: 11px; margin-top: 2px; }
    .volume-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .volume-card { background: white; border: 1px solid var(--line); border-radius: 13px; padding: 11px 12px; min-width: 0; }
    .volume-muscle { color: var(--muted); font-size: 11px; font-weight: 750; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .volume-value { font-size: 24px; font-weight: 800; letter-spacing: -.4px; margin-top: 3px; line-height: 1; }
    .volume-unit { color: var(--muted); font-size: 10px; font-weight: 650; margin-left: 3px; }
    .volume-bar { height: 5px; border-radius: 999px; background: #ededed; overflow: hidden; margin-top: 9px; }
    .volume-bar-fill { height: 100%; border-radius: inherit; background: var(--accent); }
    .volume-note { color: var(--muted); font-size: 11px; line-height: 1.4; margin-top: 11px; padding: 0 2px; }

    .picker-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }

    @media (min-width: 600px) { .day-list { grid-template-columns: repeat(2, 1fr); } }
  

    /* V11 — minimal notepad theme */
    :root {
      --bg: #e9e3d8;
      --paper: #fbf7ed;
      --card: rgba(251, 247, 237, .90);
      --text: #24221f;
      --muted: #777168;
      --line: #d8d0c2;
      --rule: rgba(113, 151, 184, .17);
      --margin-line: rgba(191, 92, 80, .28);
      --accent: #25231f;
      --soft: rgba(50, 47, 42, .045);
      --good-bg: rgba(78, 120, 85, .07);
      --warn-bg: rgba(170, 123, 44, .08);
      --radius: 6px;
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    body { background-image: none; }

    .app {
      position: relative;
      background-color: var(--paper);
      background-image: repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 31px,
        var(--rule) 31px,
        var(--rule) 32px
      );
      border-left: 1px solid #d7d0c4;
      border-right: 1px solid #d7d0c4;
      padding: 27px 18px calc(94px + var(--safe-bottom)) 30px;
      box-shadow: none;
    }

    .app::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 18px;
      width: 1px;
      background: var(--margin-line);
      pointer-events: none;
    }

    .header { margin-bottom: 20px; }
    .header h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -.6px;
    }
    .subtitle { font-size: 12px; letter-spacing: .15px; }

    .back-btn {
      width: 34px;
      height: 34px;
      border-radius: 3px;
      font-size: 24px;
    }

    .home-icon-btn, .volume-icon-btn,
    .settings-fab, .library-fab {
      background: rgba(251,247,237,.96);
      border: 1px solid #cfc6b7;
      border-radius: 5px;
      box-shadow: none;
      backdrop-filter: none;
    }

    .settings-fab, .library-fab { height: 44px; }
    .settings-fab { width: 44px; }

    .home-quote {
      margin: 0 0 25px;
      padding: 8px 4px 11px;
      border-bottom: 2px solid rgba(36,34,31,.78);
    }
    .home-quote-text {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(28px, 7.5vw, 43px);
      font-weight: 700;
      line-height: 1.04;
      letter-spacing: -1px;
    }
    .home-quote-hint {
      margin-top: 8px;
      color: #8d857a;
      font-size: 9px;
      letter-spacing: 1px;
    }

    .day-list { gap: 0; }
    .day-btn {
      min-height: 62px;
      background: transparent;
      border: 0;
      border-bottom: 1px solid #bdb4a6;
      border-radius: 0;
      padding: 14px 5px 12px;
      box-shadow: none;
    }
    .day-btn:first-child { border-top: 1px solid #bdb4a6; }
    .day-name {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 19px;
      font-weight: 700;
    }
    .day-count { font-size: 11px; }

    .exercise-card {
      background: rgba(251,247,237,.72);
      border: 0;
      border-top: 1px solid #aaa193;
      border-bottom: 1px solid #aaa193;
      border-radius: 0;
      margin-bottom: 19px;
      box-shadow: none;
      overflow: visible;
    }
    .exercise-head { padding: 12px 4px 8px; }
    .exercise-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
      font-weight: 700;
    }
    .exercise-meta { font-size: 11px; }
    .exercise-actions { gap: 4px; }
    .info-btn, .chart-btn {
      background: transparent;
      border: 1px solid #c9c0b2;
      border-radius: 4px;
      height: 30px;
      box-shadow: none;
    }
    .info-btn { width: 30px; }

    .suggestion {
      margin: 0 4px 10px;
      padding: 8px 9px;
      border-radius: 3px;
      border: 0;
      border-left: 2px solid rgba(55,101,62,.55);
      background: var(--good-bg);
    }
    .suggestion.warn {
      border-color: rgba(150,101,25,.55);
      background: var(--warn-bg);
    }
    .suggestion-title { font-size: 9px; letter-spacing: .65px; }
    .suggestion-main { font-size: 13px; }
    .suggestion-note { font-size: 11px; }

    .last-session { margin: 0 4px 8px; }
    .last-session-label { font-size: 9px; }
    .last-set-chip {
      min-height: 22px;
      padding: 2px 5px;
      border: 0;
      border-bottom: 1px solid #c7beaf;
      border-radius: 0;
      background: transparent;
      font-size: 10px;
    }

    .set-table { background: rgba(251,247,237,.46); }
    .set-table th, .set-table td {
      border-top: 1px solid #d8d0c2;
      padding: 7px 5px;
    }
    .set-table th {
      background: transparent;
      color: #81796e;
      font-size: 9px;
      letter-spacing: .7px;
    }
    .set-number { font-family: Georgia, serif; }
    .set-input {
      height: 35px;
      border: 0;
      border-bottom: 1px solid #91887b;
      border-radius: 0;
      background: transparent;
      padding: 4px 5px 2px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 17px;
    }
    .set-input:focus {
      border-color: var(--accent);
      background: rgba(255,255,255,.28);
    }
    .flag-btn {
      width: 38px;
      height: 32px;
      border-radius: 4px;
      border: 1px solid #bfb6a8;
      background: transparent;
      color: #6f685f;
      font-size: 10px;
    }
    .flag-btn.active { background: var(--accent); color: var(--paper); }
    .dropset-btn.active { background: #696258; border-color: #696258; }

    .exercise-footer {
      padding: 8px 4px 10px;
      border-top: 1px solid #d8d0c2;
    }
    .add-set-btn, .remove-set-btn {
      border-radius: 3px;
      background: transparent;
      font-size: 12px;
    }
    .add-set-btn { border: 1px solid #bfb6a8; }

    .finish-btn {
      min-height: 46px;
      border-radius: 3px;
      background: var(--accent);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 16px;
      letter-spacing: .2px;
    }

    .modal-backdrop { background: rgba(42,38,33,.34); }
    .modal {
      background-color: var(--paper);
      background-image: repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 31px,
        var(--rule) 31px,
        var(--rule) 32px
      );
      border-radius: 8px 8px 0 0;
      box-shadow: 0 -3px 18px rgba(46,40,34,.14);
    }
    .modal h2 {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 700;
    }
    .close-btn, .week-nav-btn {
      border-radius: 4px;
      background: rgba(251,247,237,.9);
      border-color: #c4baab;
    }

    .settings-card, .library-item, .detail-card,
    .strength-stat, .chart-card, .volume-card, .empty {
      background: rgba(251,247,237,.80);
      border: 1px solid #cfc6b7;
      border-radius: 4px;
      box-shadow: none;
    }

    .settings-input, .library-search {
      border: 0;
      border-bottom: 1px solid #91887b;
      border-radius: 0;
      background: rgba(255,255,255,.18);
    }
    .small-btn, .primary-btn, .danger-btn {
      border-radius: 3px;
      box-shadow: none;
    }
    .small-btn { background: transparent; border-color: #bfb6a8; }
    .primary-btn { background: var(--accent); }
    .danger-btn { background: rgba(180,35,24,.035); }

    .library-list { gap: 6px; }
    .library-item { border-left: 3px solid #bcb3a5; }
    .library-item-name { font-family: Georgia, "Times New Roman", serif; }

    .strength-stat-value, .volume-value {
      font-family: Georgia, "Times New Roman", serif;
    }
    .chart-grid { stroke: #d8d0c2; }
    .chart-line { stroke: #302d29; stroke-width: 2.25; }
    .chart-dot { fill: var(--paper); stroke: #302d29; }
    .chart-dot.latest { fill: #302d29; }
    .volume-bar { background: #ddd4c7; border-radius: 1px; }
    .volume-bar-fill { border-radius: 1px; background: #302d29; }

    .quote-stage {
      min-height: 210px;
      background: rgba(251,247,237,.54);
      border: 0;
      border-top: 1px solid #aaa193;
      border-bottom: 1px solid #aaa193;
      border-radius: 0;
    }
    .quote-text {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 700;
    }

    @media (min-width: 600px) {
      .day-list { grid-template-columns: 1fr; }
    }


    /* V12 — habits */
    .habit-home-grid {
      display: grid;
      grid-template-columns: repeat(15, minmax(0, 1fr));
      gap: 4px;
      margin: -8px 2px 23px;
      padding: 0 2px 15px;
      border-bottom: 1px solid #bdb4a6;
    }
    .habit-day-square {
      appearance: none;
      -webkit-appearance: none;
      width: 100%;
      aspect-ratio: 1;
      min-width: 0;
      padding: 0;
      border: 1px solid rgba(79,73,65,.16);
      border-radius: 2px;
      cursor: pointer;
      background: rgba(46,74,52,.04);
    }
    .habit-day-square.level-0 { background: rgba(46,74,52,.035); }
    .habit-day-square.level-1 { background: rgba(46,74,52,.20); }
    .habit-day-square.level-2 { background: rgba(46,74,52,.38); }
    .habit-day-square.level-3 { background: rgba(46,74,52,.59); }
    .habit-day-square.level-4 { background: rgba(46,74,52,.84); }
    .habit-day-square.no-habits { background: rgba(36,34,31,.035); border-style: dashed; }
    .habit-day-square.today { outline: 1px solid rgba(36,34,31,.78); outline-offset: 2px; }
    .habit-day-square:active { transform: scale(.92); }

    .habit-date-nav {
      display: grid;
      grid-template-columns: 38px 1fr 38px;
      align-items: center;
      gap: 8px;
      margin-bottom: 13px;
    }
    .habit-date-btn {
      width: 38px;
      height: 36px;
      border: 1px solid #c4baab;
      border-radius: 4px;
      background: rgba(251,247,237,.85);
      font-size: 20px;
      cursor: pointer;
    }
    .habit-date-btn:disabled { opacity: .28; cursor: default; }
    .habit-date-label { text-align: center; }
    .habit-date-main { font-family: Georgia, "Times New Roman", serif; font-weight: 700; font-size: 16px; }
    .habit-date-sub { color: var(--muted); font-size: 10px; margin-top: 2px; }
    .habit-progress-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 7px 1px 9px;
      border-bottom: 1px solid #bdb4a6;
      color: var(--muted);
      font-size: 11px;
    }
    .habit-progress-line strong { color: var(--text); font-size: 12px; }
    .habit-checklist { display: grid; gap: 0; margin: 4px 0 16px; }
    .habit-check-row {
      display: flex;
      align-items: center;
      gap: 11px;
      min-height: 51px;
      border-bottom: 1px solid #cfc6b7;
      padding: 7px 2px;
      cursor: pointer;
    }
    .habit-check-row input {
      appearance: none;
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      flex: 0 0 22px;
      border: 1.5px solid #756e64;
      border-radius: 2px;
      background: transparent;
      display: grid;
      place-items: center;
      cursor: pointer;
    }
    .habit-check-row input:checked { background: #2e4a34; border-color: #2e4a34; }
    .habit-check-row input:checked::after { content: "✓"; color: var(--paper); font-size: 15px; font-weight: 800; line-height: 1; }
    .habit-check-name { font-family: Georgia, "Times New Roman", serif; font-size: 17px; }
    .habit-check-row.done .habit-check-name { text-decoration: line-through; color: var(--muted); }
    .habit-empty { color: var(--muted); font-size: 13px; padding: 18px 2px; border-bottom: 1px solid #cfc6b7; }
    .habit-manage-toggle { width: 100%; margin-top: 4px; }
    .habit-manage { display: none; margin-top: 12px; padding-top: 7px; border-top: 1px solid #bdb4a6; }
    .habit-manage.open { display: block; }
    .habit-edit-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; margin-bottom: 8px; }
    .habit-edit-input {
      min-width: 0;
      height: 39px;
      border: 0;
      border-bottom: 1px solid #91887b;
      background: rgba(255,255,255,.16);
      padding: 6px 4px;
      font-size: 15px;
      outline: none;
    }
    .habit-delete-btn {
      height: 36px;
      border: 0;
      background: transparent;
      color: var(--danger);
      padding: 0 6px;
      cursor: pointer;
      font-size: 12px;
    }
    .habit-add-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 12px; }
    .habit-add-btn { min-height: 39px; margin: 0; width: auto; padding-inline: 14px; }

    @media (max-width: 380px) {
      .habit-home-grid { gap: 3px; }
    }


    /* V13 — calm sound */
    .sound-icon-btn {
      flex: 0 0 auto;
      width: 42px;
      height: 42px;
      border: 1px solid var(--line);
      background: var(--card);
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text);
      padding: 0;
      transition: background .15s ease, color .15s ease, border-color .15s ease;
    }
    .sound-icon-btn svg { width: 21px; height: 21px; display: block; }
    .sound-icon-btn.active {
      background: var(--text);
      color: var(--paper);
      border-color: var(--text);
    }
    .sound-settings-card {
      border-top: 1px solid #bdb4a6;
      border-bottom: 1px solid #bdb4a6;
      padding: 10px 0 12px;
      margin-bottom: 18px;
    }
    .sound-settings-title { font-size: 14px; font-weight: 800; margin-bottom: 4px; }
    .sound-settings-note { color: var(--muted); font-size: 11px; line-height: 1.45; margin: 5px 0 10px; }
    .sound-mode-select {
      width: 100%;
      min-height: 42px;
      border: 0;
      border-bottom: 1px solid #91887b;
      border-radius: 0;
      background: rgba(255,255,255,.12);
      color: var(--text);
      font-size: 15px;
      padding: 7px 4px;
      outline: none;
    }
    .sound-state-note {
      margin-top: 8px;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.4;
    }

</style>

<body>
  <main class="app" id="app"></main>
  <button class="settings-fab" id="settingsFab" aria-label="Settings" title="Settings">⚙</button>
  <button class="library-fab" id="libraryFab" aria-label="Exercise library">Library</button>

  <div class="modal-backdrop" id="settingsBackdrop">
    <section class="modal" role="dialog" aria-modal="true" aria-label="Workout settings">
      <div class="modal-head"><h2>Edit workouts</h2><button class="close-btn" id="closeSettings" aria-label="Close settings">×</button></div>
      <div id="settingsContent"></div>
      <button class="primary-btn" id="addDayBtn">+ Add workout day</button>
    </section>
  </div>

  <div class="modal-backdrop" id="libraryBackdrop">
    <section class="modal" role="dialog" aria-modal="true" aria-label="Exercise library">
      <div class="modal-head"><h2 id="libraryTitle">Exercise library</h2><button class="close-btn" id="closeLibrary" aria-label="Close library">×</button></div>
      <div id="libraryContent"></div>
    </section>
  </div>

  <div class="modal-backdrop" id="strengthBackdrop">
    <section class="modal" role="dialog" aria-modal="true" aria-label="Strength progress">
      <div class="modal-head"><h2 id="strengthTitle">Strength progress</h2><button class="close-btn" id="closeStrength" aria-label="Close strength chart">×</button></div>
      <div id="strengthContent"></div>
    </section>
  </div>

  <div class="modal-backdrop" id="volumeBackdrop">
    <section class="modal" role="dialog" aria-modal="true" aria-label="Weekly muscle sets">
      <div class="modal-head"><h2>Weekly sets</h2><button class="close-btn" id="closeVolume" aria-label="Close weekly sets">×</button></div>
      <div id="volumeContent"></div>
    </section>
  </div>



  <div class="modal-backdrop" id="habitsBackdrop">
    <section class="modal" role="dialog" aria-modal="true" aria-label="Habits">
      <div class="modal-head"><h2>Habits</h2><button class="close-btn" id="closeHabits" aria-label="Close habits">×</button></div>
      <div id="habitsContent"></div>
    </section>
  </div>

  <div class="modal-backdrop" id="quoteBackdrop">
    <section class="modal" role="dialog" aria-modal="true" aria-label="Motivation">
      <div class="modal-head"><h2>Get your head right</h2><button class="close-btn" id="closeQuote" aria-label="Close motivation">×</button></div>
      <div class="quote-stage"><p class="quote-text" id="quoteText"></p></div>
      <div class="quote-controls"><button class="primary-btn" id="newQuoteBtn">Another one</button></div>
      <div class="quote-hint">No speeches. Just the reminder you needed.</div>
    </section>
  </div>

  <script>
    const STORAGE_KEY = 'simpleGymTracker_v1';

    // Practical hypertrophy working ranges. These are not claimed to be unique physiological optima.
    // The ranges are deliberately narrower than the full evidence-supported hypertrophy spectrum so
    // that progression is easier to track and technique/fatigue remain manageable for each exercise.
    const EXERCISE_LIBRARY = [
      {id:'bench_press',name:'Bench Press',aliases:['Barbell Bench Press'],category:'Chest',min:6,max:10,increment:2.5,primary:['Pectoralis major'],secondary:['Triceps brachii','Anterior deltoid'],note:'Stable heavy compound. Use controlled full ROM and keep most sets just short of failure.'},
      {id:'incline_barbell_press',name:'Incline Barbell Press',category:'Chest',min:6,max:10,increment:2.5,primary:['Clavicular pectoralis major (upper chest)'],secondary:['Anterior deltoid','Triceps brachii'],note:'Incline pressing biases the clavicular region of the chest while still heavily involving triceps and front delts.'},
      {id:'db_bench',name:'Dumbbell Bench Press',category:'Chest',min:6,max:12,increment:2.5,primary:['Pectoralis major'],secondary:['Triceps brachii','Anterior deltoid'],note:'A stable compound press with a large usable ROM.'},
      {id:'incline_db_press',name:'Incline Dumbbell Press',category:'Chest',min:6,max:12,increment:2.5,primary:['Clavicular pectoralis major (upper chest)'],secondary:['Anterior deltoid','Triceps brachii'],note:'Good chest-focused compound with freedom to use a comfortable arm path.'},
      {id:'machine_chest_press',name:'Machine Chest Press',category:'Chest',min:8,max:15,increment:5,primary:['Pectoralis major'],secondary:['Triceps brachii','Anterior deltoid'],note:'High stability makes moderate and higher reps practical with low balance demands.'},
      {id:'smith_bench',name:'Smith Machine Bench Press',category:'Chest',min:6,max:12,increment:2.5,primary:['Pectoralis major'],secondary:['Triceps brachii','Anterior deltoid'],note:'Stable pressing variation that makes close-to-failure work easier to control.'},
      {id:'cable_fly',name:'Cable Fly',category:'Chest',min:10,max:20,increment:2.5,primary:['Pectoralis major'],secondary:['Anterior deltoid'],note:'Isolation-style chest work; higher reps are practical because systemic fatigue is low.'},
      {id:'pec_deck',name:'Pec Deck',category:'Chest',min:10,max:20,increment:5,primary:['Pectoralis major'],secondary:['Anterior deltoid'],note:'Very stable chest isolation exercise that is easy to take close to failure.'},
      {id:'db_fly',name:'Dumbbell Fly',category:'Chest',min:8,max:15,increment:2.5,primary:['Pectoralis major'],secondary:['Anterior deltoid'],note:'Use a controlled stretch and avoid forcing excessive shoulder range.'},
      {id:'incline_machine_press',name:'Incline Chest Press',aliases:['Incline Machine Chest Press'],category:'Chest',min:6,max:10,increment:5,primary:['Upper chest'],secondary:['Anterior deltoid','Triceps brachii'],note:'Stable upper-chest press. Use a comfortable incline and controlled full range.'},
      {id:'decline_cable_fly',name:'Decline Cable Fly',aliases:['High-to-Low Cable Fly'],category:'Chest',min:10,max:15,increment:2.5,primary:['Lower chest'],secondary:['Anterior deltoid'],note:'High-to-low cable path for lower-chest-focused isolation work. Keep the movement controlled and avoid turning it into a press.'},

      {id:'lat_pulldown',name:'Lat Pulldown',category:'Back',min:6,max:12,increment:5,primary:['Latissimus dorsi'],secondary:['Biceps brachii','Brachialis','Teres major','Mid/lower trapezius'],note:'Grip variations do not appear to radically change lat recruitment; choose a grip that is strong and comfortable.'},
      {id:'pull_up',name:'Pull-Up',category:'Back',min:5,max:10,increment:2.5,primary:['Latissimus dorsi'],secondary:['Biceps brachii','Brachialis','Teres major','Mid/lower trapezius'],note:'Excellent vertical pull. Add load once bodyweight reps are consistently at the top of the range.'},
      {id:'assisted_pullup',name:'Assisted Pull-Up',category:'Back',min:6,max:10,increment:5,loadType:'assistance',primary:['Latissimus dorsi'],secondary:['Biceps brachii','Brachialis','Teres major','Mid/lower trapezius'],note:'Progress by reducing assistance once all working sets reach the top of the rep range.'},
      {id:'chest_supported_row',name:'Chest-Supported Row',category:'Back',min:6,max:12,increment:2.5,primary:['Latissimus dorsi','Rhomboids','Middle trapezius'],secondary:['Posterior deltoid','Biceps brachii','Brachialis'],note:'Chest support reduces lower-back fatigue and makes the upper-back musculature easier to load hard.'},
      {id:'seated_row',name:'Seated Row',aliases:['Seated Cable Row'],category:'Back',min:6,max:12,increment:5,primary:['Latissimus dorsi','Rhomboids','Middle trapezius'],secondary:['Posterior deltoid','Biceps brachii','Brachialis'],note:'Use a controlled reach and pull without turning it into a lower-back movement.'},
      {id:'barbell_row',name:'Barbell Row',category:'Back',min:5,max:10,increment:2.5,primary:['Latissimus dorsi','Rhomboids','Middle trapezius'],secondary:['Posterior deltoid','Biceps brachii','Spinal erectors'],note:'Effective but more systemically fatiguing than chest-supported or machine rows.'},
      {id:'db_row',name:'One-Arm Dumbbell Row',category:'Back',min:6,max:12,increment:2.5,primary:['Latissimus dorsi','Rhomboids'],secondary:['Posterior deltoid','Biceps brachii','Middle trapezius'],note:'Useful unilateral row with a large range of motion.'},
      {id:'machine_row',name:'Machine Row',category:'Back',min:8,max:15,increment:5,primary:['Latissimus dorsi','Rhomboids','Middle trapezius'],secondary:['Posterior deltoid','Biceps brachii'],note:'High stability makes close-to-failure work practical.'},
      {id:'straight_arm_pd',name:'Straight-Arm Pulldown',category:'Back',min:10,max:20,increment:2.5,primary:['Latissimus dorsi'],secondary:['Teres major','Long head triceps (isometric/supporting)'],note:'Lat-focused shoulder-extension movement with little elbow-flexor limitation.'},
      {id:'cable_pullover',name:'Cable Pullover',category:'Back',min:10,max:20,increment:2.5,primary:['Latissimus dorsi'],secondary:['Teres major','Pectoralis major'],note:'Useful lat isolation-style movement when performed through a controlled stretch.'},
      {id:'close_grip_tbar_row',name:'Close-Grip T-Bar Row',category:'Back',min:6,max:10,increment:5,primary:['Latissimus dorsi','Rhomboids','Middle trapezius'],secondary:['Posterior deltoid','Biceps brachii','Brachialis'],note:'Heavy close-grip row for lats and upper back. Keep the torso stable and drive the elbows back.'},
      {id:'single_arm_cable_lat_row',name:'Single-Arm Cable Lat Row',category:'Back',min:10,max:15,increment:2.5,primary:['Latissimus dorsi'],secondary:['Rhomboids','Biceps brachii','Posterior deltoid'],note:'Unilateral lat-focused row. Keep the shoulder controlled and pull the elbow toward the hip.'},

      {id:'ohp',name:'Overhead Press',aliases:['Barbell Overhead Press'],category:'Shoulders',min:5,max:10,increment:2.5,primary:['Anterior deltoid'],secondary:['Lateral deltoid','Triceps brachii','Upper chest'],note:'Heavy compound shoulder press; front delts and triceps do most of the work.'},
      {id:'db_shoulder_press',name:'Dumbbell Shoulder Press',category:'Shoulders',min:6,max:12,increment:2.5,primary:['Anterior deltoid'],secondary:['Lateral deltoid','Triceps brachii'],note:'Good compound shoulder option with freedom to use a comfortable arm path.'},
      {id:'machine_shoulder_press',name:'Machine Shoulder Press',category:'Shoulders',min:8,max:15,increment:5,primary:['Anterior deltoid'],secondary:['Lateral deltoid','Triceps brachii'],note:'Stable option that is easy to push close to failure.'},
      {id:'db_lateral_raise',name:'Dumbbell Lateral Raise',category:'Shoulders',min:10,max:20,increment:1,primary:['Lateral deltoid'],secondary:['Anterior/posterior deltoid','Upper trapezius'],note:'Higher reps suit the small load increments and low systemic fatigue of lateral raises.'},
      {id:'cable_lateral_raise',name:'Cable Lateral Raise',category:'Shoulders',min:10,max:20,increment:1,primary:['Lateral deltoid'],secondary:['Anterior/posterior deltoid','Upper trapezius'],note:'Cable and dumbbell lateral raises have both produced similar lateral-delt growth in direct research.'},
      {id:'reverse_pec_deck',name:'Reverse Pec Deck',category:'Shoulders',min:10,max:20,increment:5,primary:['Posterior deltoid'],secondary:['Rhomboids','Middle trapezius'],note:'Stable rear-delt movement with low systemic fatigue.'},
      {id:'rear_delt_cable',name:'Rear Delt Cable Fly',category:'Shoulders',min:10,max:20,increment:2.5,primary:['Posterior deltoid'],secondary:['Rhomboids','Middle trapezius'],note:'Cable resistance is useful for controlled rear-delt work.'},

      {id:'barbell_curl',name:'Barbell Curl',category:'Biceps',min:6,max:12,increment:2.5,primary:['Biceps brachii','Brachialis'],secondary:['Brachioradialis','Forearm flexors'],note:'Simple heavy elbow-flexion movement.'},
      {id:'ez_curl',name:'EZ-Bar Curl',category:'Biceps',min:6,max:12,increment:2.5,primary:['Biceps brachii','Brachialis'],secondary:['Brachioradialis','Forearm flexors'],note:'Often more wrist-friendly than a straight bar while still allowing useful loading.'},
      {id:'db_curl',name:'Dumbbell Curl',aliases:['Biceps Curl'],category:'Biceps',min:8,max:15,increment:2.5,primary:['Biceps brachii','Brachialis'],secondary:['Brachioradialis','Forearm flexors'],note:'Flexible arm path and easy unilateral loading.'},
      {id:'incline_curl',name:'Incline Dumbbell Curl',category:'Biceps',min:8,max:15,increment:2.5,primary:['Biceps brachii'],secondary:['Brachialis','Brachioradialis'],note:'Places the shoulder behind the torso and loads the elbow flexors through a long range.'},
      {id:'preacher_curl',name:'Preacher Curl',category:'Biceps',min:8,max:15,increment:2.5,primary:['Biceps brachii','Brachialis'],secondary:['Brachioradialis'],note:'Very stable curl; regional growth can differ from other curl variations, so exercise variety can be useful.'},
      {id:'bayesian_curl',name:'Bayesian Cable Curl',category:'Biceps',min:10,max:20,increment:2.5,primary:['Biceps brachii'],secondary:['Brachialis','Brachioradialis'],note:'Cable setup can keep tension high with the arm behind the torso.'},
      {id:'hammer_curl',name:'Hammer Curl',category:'Biceps',min:8,max:15,increment:2.5,primary:['Brachialis','Brachioradialis'],secondary:['Biceps brachii'],note:'Neutral grip shifts more emphasis toward brachialis and brachioradialis.'},
      {id:'cable_curl',name:'Cable Curl',category:'Biceps',min:10,max:20,increment:2.5,primary:['Biceps brachii','Brachialis'],secondary:['Brachioradialis'],note:'Stable resistance and easy small load progressions.'},

      {id:'pushdown',name:'Triceps Pushdown',category:'Triceps',min:8,max:15,increment:2.5,primary:['Triceps brachii'],secondary:['Anconeus'],note:'Stable triceps isolation exercise; good for hard sets without much systemic fatigue.'},
      {id:'overhead_triceps',name:'Overhead Cable Triceps Extension',category:'Triceps',min:10,max:20,increment:2.5,primary:['Triceps brachii (especially long head)'],secondary:['Anconeus'],note:'Overhead elbow extension trains the long head at a longer muscle length and has shown greater triceps growth than neutral-arm extension in direct research.'},
      {id:'skullcrusher',name:'Skull Crusher',aliases:['Lying Triceps Extension'],category:'Triceps',min:8,max:15,increment:2.5,primary:['Triceps brachii'],secondary:['Anconeus'],note:'Use a controlled elbow path and a load that does not irritate the elbows.'},
      {id:'close_grip_bench',name:'Close-Grip Bench Press',category:'Triceps',min:6,max:10,increment:2.5,primary:['Triceps brachii'],secondary:['Pectoralis major','Anterior deltoid'],note:'Heavy triceps-focused press, although the chest and front delts still contribute.'},

      {id:'assisted_triceps_dip',name:'Assisted Triceps Dip',aliases:['Assisted Dip'],category:'Triceps',min:8,max:12,increment:5,loadType:'assistance',primary:['Triceps brachii'],secondary:['Lower chest','Anterior deltoid'],note:'Use an upright torso and triceps-focused elbow path. Progress by reducing assistance, not increasing it.'},
      {id:'single_arm_pushdown',name:'Single-Arm Cable Pushdown',category:'Triceps',min:10,max:15,increment:2.5,primary:['Triceps brachii'],secondary:['Anconeus'],note:'Single-arm pushdown that is easy to standardise side-to-side. Keep the upper arm still.'},

      {id:'back_squat',name:'Squat',aliases:['Back Squat'],category:'Legs',min:5,max:10,increment:2.5,primary:['Quadriceps','Gluteus maximus'],secondary:['Adductors','Spinal erectors'],note:'Large compound movement. Full comfortable depth generally provides more complete muscular loading than deliberately shallow reps.'},
      {id:'front_squat',name:'Front Squat',category:'Legs',min:5,max:10,increment:2.5,primary:['Quadriceps','Gluteus maximus'],secondary:['Adductors','Spinal erectors','Upper back'],note:'Quad-focused squat pattern with substantial trunk demand.'},
      {id:'hack_squat',name:'Hack Squat',category:'Legs',min:6,max:12,increment:5,primary:['Quadriceps','Gluteus maximus'],secondary:['Adductors'],note:'Stable squat pattern that makes hard quad-focused sets easier to standardize.'},

    function isUntouchedLegacyStarter(d) {
      if (!d || !Array.isArray(d.days) || d.days.length !== 3) return false;
      const expected = [
        ['Chest / Triceps',['bench_press','incline_db_press','pushdown']],
        ['Back / Biceps',['lat_pulldown','seated_row','db_curl']],
        ['Legs',['back_squat','leg_press','seated_leg_curl']]

        return day && day.name === entry[0] && Array.isArray(day.exercises) &&
          day.exercises.map(ex => ex.libraryId || (matchLibrary(ex.name) || {}).id).join('|') === entry[1].join('|');
      });
      if (!shapeMatches) return false;
      const hasHistory = d.history && Object.values(d.history).some(day => day && Object.keys(day).length);
      if (hasHistory) return false;
      const hasEnteredSet = d.logs && Object.values(d.logs).some(dayLog => dayLog && Object.values(dayLog).some(sets =>

      return sets
        .map((s, i) => ({ index: i, weight: Number(s.weight), reps: Number(s.reps), failure: !!s.failure, dropset: !!s.dropset }))

    function roundToStep(value, step) {
      if (!step || step <= 0) return Math.max(0, value);

    function estimatedOneRepMax(weight, reps) {
      if (!Number.isFinite(weight) || weight <= 0 || !Number.isFinite(reps) || reps <= 0) return null;
      return weight * (1 + reps / 30);
    }

    function sessionStrength(session) {
      if (!session || !Array.isArray(session.sets)) return null;
      const normal = completedSets(session.sets).filter(s => !s.dropset && s.weight > 0);
      if (!normal.length) return null;
      let best = null;
      let bestSet = null;
      normal.forEach(s => {
        const e1rm = estimatedOneRepMax(s.weight, s.reps);
        if (e1rm !== null && (best === null || e1rm > best)) { best = e1rm; bestSet = s; }
      });
      return best === null ? null : { value: best, set: bestSet };
    }

      const first = points[0].value;

          <div class="strength-stat"><div class="strength-stat-label">Change</div><div class="strength-stat-value ${changeClass}">${sign}${Number(change.toFixed(1))}%</div><div class="strength-stat-sub">vs first session</div></div>
        </div>
        <div class="chart-card"><div class="chart-wrap" id="strengthChartWrap"></div><div class="chart-note">Estimated 1RM uses your strongest non-drop-set performance from each finished workout. It can show progress when reps increase even before the weight goes up. Treat it as a trend, not an exact max-lift prediction.</div><div class="history-mini" id="strengthHistoryMini"></div></div>`;

        row.className = 'history-row';

        mini.appendChild(row);
      });

    function renderStrengthSvg(wrap, points) {
      const width = 620, height = 270;
      const margin = { left: 50, right: 16, top: 20, bottom: 42 };
      const plotW = width - margin.left - margin.right;
      const plotH = height - margin.top - margin.bottom;
      const values = points.map(p => p.value);
      const rawMin = Math.min(...values);
      const rawMax = Math.max(...values);
      let yMin = Math.max(0, rawMin * 0.9);
      let yMax = rawMax * 1.1;
      if (Math.abs(yMax - yMin) < 1) { yMin = Math.max(0, rawMin - 1); yMax = rawMax + 1; }
      const x = i => points.length === 1 ? margin.left + plotW / 2 : margin.left + (i / (points.length - 1)) * plotW;
      const y = v => margin.top + (1 - (v - yMin) / (yMax - yMin)) * plotH;

      let svg = `<svg class="strength-svg" viewBox="0 0 ${width} ${height}" role="img" aria-label="Estimated strength progress over time">`;
      for (let i = 0; i <= 4; i++) {
        const val = yMin + ((yMax - yMin) * i / 4);
        const yy = y(val);
        svg += `<line class="chart-grid" x1="${margin.left}" y1="${yy}" x2="${width-margin.right}" y2="${yy}" />`;
        svg += `<text class="chart-axis-text" x="${margin.left-8}" y="${yy+4}" text-anchor="end">${Number(val.toFixed(1))}</text>`;
      }
      const pathPoints = points.map((p,i) => `${x(i)},${y(p.value)}`).join(' ');
      if (points.length > 1) svg += `<polyline class="chart-line" points="${pathPoints}" />`;
      points.forEach((p,i) => {
        svg += `<circle class="chart-dot ${i === points.length - 1 ? 'latest' : ''}" cx="${x(i)}" cy="${y(p.value)}" r="5"><title>${escapeXml(formatDateShort(p.date))}: ${escapeXml(formatStrength(p.value))} from ${formatWeight(p.set.weight)} kg × ${p.set.reps}</title></circle>`;
      });
      const labels = points.length <= 6 ? points.map((_,i) => i) : [0, Math.floor((points.length-1)/2), points.length-1];
      [...new Set(labels)].forEach(i => {
        svg += `<text class="chart-axis-text" x="${x(i)}" y="${height-15}" text-anchor="middle">${escapeXml(formatDateShort(points[i].date))}</text>`;
      });
      svg += `<text class="chart-axis-text" transform="translate(14 ${margin.top + plotH/2}) rotate(-90)" text-anchor="middle">e1RM (kg)</text></svg>`;
      wrap.innerHTML = svg;
    }

    function balancedPlusOne(reps, max) {
      const out = reps.slice();
      let best = -1;
      let lowest = Infinity;
      for (let i = 0; i < out.length; i++) {
        if (out[i] >= max) continue;
        if (out[i] < lowest) { lowest = out[i]; best = i; }
      }
      if (best >= 0) out[best] += 1;
      return out;
    }

    function resetTargets(setCount, min, max) {
      const base = Math.min(max, min + 2);
      const arr = [];
      for (let i = 0; i < setCount; i++) arr.push(Math.max(min, base - i));
      return arr;
    }

    function median(values) {
      if (!values.length) return null;
      const s = values.slice().sort((a,b) => a-b);
      const m = Math.floor(s.length / 2);
      return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
    }

    function straightSessionPattern(ex, session) {
      if (!session || !Array.isArray(session.sets)) return null;
      const cfg = exerciseConfig(ex);
      const sets = completedSets(session.sets).filter(s => !s.dropset);
      if (!sets.length) return null;
      const reps = sets.map(s => s.reps);
      const weights = sets.map(s => s.weight);
      const sameWeight = weights.every(w => Math.abs(w - weights[0]) < 0.001);
      const first = reps[0];
      const last = reps[reps.length - 1];
      const belowMinCount = reps.filter(r => r < cfg.min).length;
      const earlyFailures = sets.slice(0, -1).filter(s => s.failure).length;
      const anyFailure = sets.some(s => s.failure);
      const avgReps = reps.reduce((a,b) => a+b, 0) / reps.length;
      const totalReps = reps.reduce((a,b) => a+b, 0);
      const severeCollapse = reps.length >= 3 && last < cfg.min && last <= first * 0.5 && (first - last) >= 4;
      const firstTooHeavy = first < cfg.min && !!sets[0].failure;
      const manyBelowMin = belowMinCount >= Math.ceil(reps.length / 2) && (anyFailure || avgReps < cfg.min - 1);
      const allAtTop = reps.every(r => r >= cfg.max);
      return {cfg, sets, reps, weights, sameWeight, workingWeight:weights[0], first, last, belowMinCount,
        earlyFailures, anyFailure, avgReps, totalReps, severeCollapse, firstTooHeavy, manyBelowMin, allAtTop};
    }

    function sameWorkingWeight(a, b) {
      return a && b && a.sameWeight && b.sameWeight && Math.abs(a.workingWeight - b.workingWeight) < 0.001;
    }

    function nextBalancedTarget(pattern) {
      const reps = pattern.reps.map(r => Math.min(r, pattern.cfg.max));
      const candidates = reps.map((r,i) => ({i,r,failure:!!pattern.sets[i].failure}))
        .filter(x => x.r < pattern.cfg.max);
      if (!candidates.length) return reps;

      // If failure occurred before the final set, first make the same performance cleaner instead of
      // blindly demanding another rep. This avoids creating a fatigue spiral from early-set failure.
      if (pattern.earlyFailures > 0) return reps;

      // Prefer adding the rep to the lowest-rep non-failure set; ties go to the earlier set.
      // This gives intuitive targets such as 8,6,6 -> 8,7,6.
      let pool = candidates.filter(x => !x.failure);
      if (!pool.length) pool = candidates;
      pool.sort((a,b) => (a.r - b.r) || (a.i - b.i));
      reps[pool[0].i] += 1;
      return reps;
    }

    function mixedLoadTarget(pattern) {
      const targets = pattern.reps.map(r => Math.min(r, pattern.cfg.max));
      const candidates = targets.map((r,i) => ({i,r,failure:!!pattern.sets[i].failure})).filter(x => x.r < pattern.cfg.max);
      if (pattern.earlyFailures === 0 && candidates.length) {
        let pool = candidates.filter(x => !x.failure);
        if (!pool.length) pool = candidates;
        pool.sort((a,b) => (a.r - b.r) || (a.i - b.i));
        targets[pool[0].i] += 1;
      }
      return targets;
    }

    function recommendationConfidence(comparableCount) {
      if (comparableCount >= 2) return 'High confidence';
      if (comparableCount === 1) return 'Medium confidence';
      return 'Low confidence';
    }

    function recommendNext(day, ex) {
      const history = historyFor(day.id, ex.id);
      if (!history.length) return null;
      const session = history[history.length - 1];
      const p = straightSessionPattern(ex, session);
      if (!p) return null;
      const {cfg, reps, weights, sameWeight, workingWeight, earlyFailures, allAtTop} = p;
      const inc = cfg.increment;
      const isAssistance = cfg.loadType === 'assistance';

      const priorPatterns = history.slice(0, -1).map(s => straightSessionPattern(ex, s)).filter(Boolean);
      const comparable = priorPatterns.filter(q => sameWorkingWeight(p, q) && q.reps.length === p.reps.length).slice(-3);
      const recentTotals = comparable.map(q => q.totalReps);
      const recentMedian = median(recentTotals);
      const mostRecentComparable = comparable.length ? comparable[comparable.length - 1] : null;
      const currentPoor = p.severeCollapse || p.firstTooHeavy || p.manyBelowMin;
      const previousPoor = mostRecentComparable && (mostRecentComparable.severeCollapse || mostRecentComparable.firstTooHeavy || mostRecentComparable.manyBelowMin);
      const clearOneOffDip = currentPoor && mostRecentComparable && !previousPoor && p.totalReps <= mostRecentComparable.totalReps - 2;
      const repeatedPoor = currentPoor && !!previousPoor;
      const confidence = recommendationConfidence(comparable.length);

      if (!sameWeight) {
        const targets = mixedLoadTarget(p);
        const descending = weights.every((w,i) => i === 0 || w <= weights[i-1] + 0.001);
        const pieces = weights.map((w,i) => `${formatWeight(w)}${isAssistance ? 'kg assist ' : 'kg '}×${targets[i]}`);
        return {
          kind:'hold', weight:null, reps:targets, title:'Keep your set weights',
          main: pieces.join(' · '),
          note: `${descending ? 'Back-off set pattern detected.' : 'Mixed loads detected.'} Keep the same set weights and ${earlyFailures ? 'repeat the reps with less early failure' : 'add one total rep'}. ${confidence}.`
        };
      }

      // A clear poor pattern with no contradictory history can justify one load step down. If the same
      // weight was fine last time, treat the new result as a likely off-day first and repeat the load.
      if (currentPoor && inc > 0 && !clearOneOffDip && (repeatedPoor || comparable.length === 0 || (recentMedian !== null && p.totalReps <= recentMedian - Math.max(2, reps.length)))) {
        const newWeight = Math.max(0, roundToStep(workingWeight + (isAssistance ? inc : -inc), inc));
        const targets = resetTargets(reps.length, cfg.min, cfg.max);
        let reason = p.severeCollapse ? `Reps collapsed from ${p.first} to ${p.last}.` : (p.firstTooHeavy ? 'Your first working set was below range and reached failure.' : 'Too many working sets were below the target range.');
        if (repeatedPoor) reason += ' This has now happened in consecutive comparable sessions.';
        return {
          kind:'reduce', weight:newWeight, reps:targets, title:isAssistance ? 'Add assistance next time' : 'Reduce load next time',
          main:`${formatWeight(newWeight)} kg${isAssistance ? ' assist' : ''} × ${targets.join(', ')} reps`,
          note:`${reason} ${isAssistance ? 'Add one assistance step and rebuild, then reduce assistance again once performance is back in range.' : 'Drop one configured weight step and rebuild.'} ${confidence}.`
        };
      }

      if (clearOneOffDip) {
        const targets = mostRecentComparable.reps.map(r => Math.min(r, cfg.max));
        return {
          kind:'hold', weight:workingWeight, reps:targets, title:isAssistance ? 'Repeat the assistance' : 'Repeat the weight',
          main:`${formatWeight(workingWeight)} kg${isAssistance ? ' assist' : ''} × ${targets.join(', ')} reps`,
          note:`This session was clearly worse than your previous comparable one, so ${isAssistance ? "don't change the assistance from one bad day" : "don't cut the load from one bad day"}. Aim to return to your prior performance, take full rest, and reassess next session. ${confidence}.`
        };
      }

      if (allAtTop && inc > 0) {
        const newWeight = Math.max(0, roundToStep(workingWeight + (isAssistance ? -inc : inc), inc));
        const targets = resetTargets(reps.length, cfg.min, cfg.max);
        return {
          kind:'increase', weight:newWeight, reps:targets, title:isAssistance ? 'Reduce assistance next time' : 'Add weight next time',
          main:`${formatWeight(newWeight)} kg${isAssistance ? ' assist' : ''} × ${targets.join(', ')} reps`,
          note:`Every straight set reached the top of the ${cfg.min}–${cfg.max} range. ${isAssistance ? 'Reduce assistance by one configured step' : 'Increase by one configured weight step'} and rebuild within the range. ${confidence}.`
        };
      }

      // Detect a genuine same-load stall, but do not force a load jump just to create novelty.
      const totalsWithCurrent = comparable.slice(-2).map(q => q.totalReps).concat(p.totalReps);
      const stalledThree = totalsWithCurrent.length === 3 && Math.max(...totalsWithCurrent) - Math.min(...totalsWithCurrent) <= 1;

      const targets = nextBalancedTarget(p);
      let note;
      if (earlyFailures > 0) {
        note = `${isAssistance ? 'Keep the same assistance' : 'Keep the load'} and repeat these reps, but avoid failure on the early sets; use enough rest and save failure for the final set if you want it.`;
      } else {
        note = `${isAssistance ? 'Keep the same assistance' : 'Keep the load'} and add one total rep while staying in the ${cfg.min}–${cfg.max} working range.`;
      }
      if (stalledThree) note += ' You have been essentially flat for three comparable sessions; prioritise full rest and clean execution before changing the load.';
      note += ` ${confidence}.`;
      return {
        kind:'hold', weight:workingWeight, reps:targets, title: earlyFailures ? 'Repeat cleanly' : (isAssistance ? 'Keep the assistance' : 'Keep the weight'),
        main:`${formatWeight(workingWeight)} kg${isAssistance ? ' assist' : ''} × ${targets.join(', ')} reps`, note
      };
    }

    function localWeekRange(offset = 0) {
      const today = new Date();
      today.setHours(0,0,0,0);
      const mondayIndex = (today.getDay() + 6) % 7;
      const start = new Date(today);
      start.setDate(today.getDate() - mondayIndex + (offset * 7));
      const end = new Date(start);
      end.setDate(start.getDate() + 7);
      return {start, end};
    }

    function shortLocalDate(date) {
      return date.toLocaleDateString(undefined, {day:'numeric', month:'short'});
    }

    function weeklyDirectSets(offset = 0) {
      const {start, end} = localWeekRange(offset);
      const counts = Object.fromEntries(MAJOR_MUSCLES.map(m => [m, 0]));
      let unassigned = 0;
      data.days.forEach(day => {
        day.exercises.forEach(ex => {
          const lib = getLibraryForExercise(ex);
          const groups = primaryMajorMuscles(lib);
          const sessions = historyFor(day.id, ex.id);
          sessions.forEach(session => {
            const date = new Date(session.date);
            if (!(date >= start && date < end)) return;
            const setCount = Array.isArray(session.sets) ? session.sets.filter(s => Number(s.reps) > 0).length : 0;
            if (!setCount) return;
            if (!groups.length) { unassigned += setCount; return; }
            groups.forEach(group => counts[group] += setCount);
          });
        });
      });
      return {counts, unassigned, start, end};
    }

    function renderWeeklyVolume() {
      const content = document.getElementById('volumeContent');
      const summary = weeklyDirectSets(volumeWeekOffset);
      const maxCount = Math.max(1, ...Object.values(summary.counts));
      const endDisplay = new Date(summary.end);
      endDisplay.setDate(endDisplay.getDate() - 1);
      const weekName = volumeWeekOffset === 0 ? 'This week' : (volumeWeekOffset === -1 ? 'Last week' : `${Math.abs(volumeWeekOffset)} weeks ago`);
      content.innerHTML = `
        <div class="week-nav">
          <button class="week-nav-btn" id="prevVolumeWeek" aria-label="Previous week">‹</button>
          <div class="week-label"><div class="week-label-main">${weekName}</div><div class="week-label-sub">${shortLocalDate(summary.start)} – ${shortLocalDate(endDisplay)}</div></div>
          <button class="week-nav-btn" id="nextVolumeWeek" aria-label="Next week" ${volumeWeekOffset >= 0 ? 'disabled' : ''}>›</button>
        </div>
        <div class="volume-grid" id="volumeGrid"></div>
        <div class="volume-note" id="volumeNote"></div>`;
      const grid = content.querySelector('#volumeGrid');
      MAJOR_MUSCLES.forEach(muscle => {
        const value = summary.counts[muscle] || 0;
        const card = document.createElement('div');
        card.className = 'volume-card';
        card.innerHTML = `<div class="volume-muscle"></div><div><span class="volume-value"></span><span class="volume-unit">sets</span></div><div class="volume-bar"><div class="volume-bar-fill"></div></div>`;
        card.querySelector('.volume-muscle').textContent = muscle;
        card.querySelector('.volume-value').textContent = value;
        card.querySelector('.volume-bar-fill').style.width = `${Math.round((value / maxCount) * 100)}%`;
        grid.appendChild(card);
      });
      const note = content.querySelector('#volumeNote');
      note.textContent = `Counts completed direct working sets from Monday to Sunday. Secondary-muscle work is not counted as a full set.${summary.unassigned ? ` ${summary.unassigned} set${summary.unassigned === 1 ? '' : 's'} from custom/unmatched exercises are not assigned to a muscle.` : ''}`;
      content.querySelector('#prevVolumeWeek').addEventListener('click', () => { volumeWeekOffset -= 1; renderWeeklyVolume(); });
      content.querySelector('#nextVolumeWeek').addEventListener('click', () => { if (volumeWeekOffset < 0) { volumeWeekOffset += 1; renderWeeklyVolume(); } });
    }

    function openWeeklyVolume() {
      volumeWeekOffset = 0;
      renderWeeklyVolume();
      document.getElementById('volumeBackdrop').classList.add('open');
    }

    function localDateKey(date) {
      const d = new Date(date);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function parseLocalDateKey(key) {
      const [y, m, d] = String(key).split('-').map(Number);
      return new Date(y, (m || 1) - 1, d || 1, 12, 0, 0, 0);
    }

    function addLocalDays(date, amount) {
      const d = new Date(date);
      d.setDate(d.getDate() + amount);
      return d;
    }

    function habitsForDate(dateKey) {
      return (data.habits || []).filter(h => {
        const created = h.createdOn || localDateKey(new Date());
        const archived = h.archivedOn || null;
        return created <= dateKey && (!archived || dateKey < archived);
      });
    }

    function habitStatusForDate(dateKey) {
      if (!data.habitLog[dateKey]) data.habitLog[dateKey] = {};
      return data.habitLog[dateKey];
    }

    function habitCompletion(dateKey) {
      const habits = habitsForDate(dateKey);
      if (!habits.length) return { done: 0, total: 0, fraction: null };
      const status = (data.habitLog || {})[dateKey] || {};
      const done = habits.reduce((sum, h) => sum + (status[h.id] ? 1 : 0), 0);
      return { done, total: habits.length, fraction: done / habits.length };
    }

    function habitShadeLevel(fraction) {
      if (fraction === null) return -1;
      if (fraction <= 0) return 0;
      if (fraction >= 1) return 4;
      if (fraction <= .25) return 1;
      if (fraction <= .5) return 2;
      return 3;
    }

    function lastThirtyDateKeys() {
      const today = new Date();
      const keys = [];
      for (let i = 29; i >= 0; i--) keys.push(localDateKey(addLocalDays(today, -i)));
      return keys;
    }

    function renderHabitHomeGrid() {
      const grid = document.getElementById('habitHomeGrid');
      if (!grid) return;
      grid.innerHTML = '';
      const today = localDateKey(new Date());
      lastThirtyDateKeys().forEach(dateKey => {
        const progress = habitCompletion(dateKey);
        const level = habitShadeLevel(progress.fraction);
        const btn = document.createElement('button');
        btn.className = `habit-day-square ${level < 0 ? 'no-habits' : `level-${level}`} ${dateKey === today ? 'today' : ''}`;
        const date = parseLocalDateKey(dateKey);
        const label = date.toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
        btn.setAttribute('aria-label', progress.total ? `${label}: ${progress.done} of ${progress.total} habits complete` : `${label}: no habits tracked`);
        btn.title = progress.total ? `${label} · ${progress.done}/${progress.total}` : `${label} · no habits`;
        btn.addEventListener('click', () => openHabits(dateKey));
        grid.appendChild(btn);
      });
    }

    function formatHabitDate(dateKey) {
      const d = parseLocalDateKey(dateKey);
      return d.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });
    }

    function renderHabits() {
      const content = document.getElementById('habitsContent');
      if (!content) return;
      const todayKey = localDateKey(new Date());
      if (!selectedHabitDate || selectedHabitDate > todayKey) selectedHabitDate = todayKey;
      const habits = habitsForDate(selectedHabitDate);
      const status = habitStatusForDate(selectedHabitDate);
      const progress = habitCompletion(selectedHabitDate);
      const selectedDate = parseLocalDateKey(selectedHabitDate);
      const yesterdayKey = localDateKey(addLocalDays(selectedDate, -1));
      const tomorrowKey = localDateKey(addLocalDays(selectedDate, 1));

      content.innerHTML = `

      document.getElementById('habitDateMain').textContent = selectedHabitDate === todayKey ? 'Today' : formatHabitDate(selectedHabitDate);

      document.getElementById('habitNextDay').disabled = selectedHabitDate >= todayKey;
      document.getElementById('habitPrevDay').addEventListener('click', () => { selectedHabitDate = yesterdayKey; renderHabits(); });
      document.getElementById('habitNextDay').addEventListener('click', () => { if (tomorrowKey <= todayKey) { selectedHabitDate = tomorrowKey; renderHabits(); } });

      const checklist = document.getElementById('habitChecklist');
      if (!habits.length) {
        checklist.innerHTML = '<div class="habit-empty">No habits existed on this day.</div>';
      } else {
        habits.forEach(habit => {
          const label = document.createElement('label');
          label.className = `habit-check-row ${status[habit.id] ? 'done' : ''}`;
          const input = document.createElement('input');
          input.type = 'checkbox';
          input.checked = !!status[habit.id];
          input.setAttribute('aria-label', habit.name);
          const name = document.createElement('span');
          name.className = 'habit-check-name';
          name.textContent = habit.name;
          input.addEventListener('change', () => {
            status[habit.id] = input.checked;
            saveData();
            renderHabits();
          });
          label.append(input, name);
          checklist.appendChild(label);
        });
      }

      const manage = document.getElementById('habitManage');
      document.getElementById('habitManageToggle').addEventListener('click', () => {
        manage.classList.toggle('open');
        document.getElementById('habitManageToggle').textContent = manage.classList.contains('open') ? 'Done editing' : 'Edit habits';
      });

      const editList = document.getElementById('habitEditList');
      const activeToday = habitsForDate(todayKey);
      if (!activeToday.length) editList.innerHTML = '<div class="habit-empty">No active habits. Add one below.</div>';
      activeToday.forEach(habit => {
        const row = document.createElement('div');
        row.className = 'habit-edit-row';
        const input = document.createElement('input');
        input.className = 'habit-edit-input';
        input.value = habit.name;
        input.setAttribute('aria-label', `Habit name: ${habit.name}`);
        input.addEventListener('change', () => {
          habit.name = input.value.trim() || 'Untitled habit';
          saveData();
          renderHabits();
          const m = document.getElementById('habitManage'); if (m) m.classList.add('open');
        });
        const del = document.createElement('button');
        del.className = 'habit-delete-btn';
        del.textContent = 'Remove';
        del.addEventListener('click', () => {
          habit.archivedOn = todayKey;
          saveData();
          renderHabits();
          const m = document.getElementById('habitManage'); if (m) m.classList.add('open');
        });
        row.append(input, del);
        editList.appendChild(row);
      });

      const newInput = document.getElementById('newHabitName');
      const addHabit = () => {
        const name = newInput.value.trim();
        if (!name) return;
        data.habits.push({ id: cryptoId(), name, createdOn: todayKey, archivedOn: null });
        saveData();
        renderHabits();
        const m = document.getElementById('habitManage'); if (m) m.classList.add('open');
      };
      document.getElementById('addHabitAction').addEventListener('click', addHabit);
      newInput.addEventListener('keydown', e => { if (e.key === 'Enter') addHabit(); });
    }

    function calmSoundLabel(mode = data.soundMode) {
      if (mode === 'binaural10') return '10 Hz binaural beat';
      if (mode === 'tone852') return '852 Hz tone';
      return 'Brown noise';
    }

    async function getCalmAudioContext() {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) throw new Error('Web Audio is not supported in this browser.');
      if (!calmAudioContext) calmAudioContext = new AudioCtx();
      if (calmAudioContext.state === 'suspended') await calmAudioContext.resume();
      return calmAudioContext;
    }

    function makeBrownNoiseSource(ctx) {
      const seconds = 8;
      const length = Math.floor(ctx.sampleRate * seconds);
      const buffer = ctx.createBuffer(1, length, ctx.sampleRate);
      const output = buffer.getChannelData(0);
      let last = 0;
      for (let i = 0; i < length; i++) {
        const white = Math.random() * 2 - 1;
        last = (last + 0.02 * white) / 1.02;
        output[i] = Math.max(-1, Math.min(1, last * 3.5));
      }
      const source = ctx.createBufferSource();
      source.buffer = buffer;
      source.loop = true;
      return source;
    }

    function updateCalmSoundButton() {
      const btn = document.getElementById('soundHomeBtn');
      if (!btn) return;
      btn.classList.toggle('active', calmSoundOn);
      btn.setAttribute('aria-pressed', calmSoundOn ? 'true' : 'false');
      btn.title = calmSoundOn ? `Stop ${calmSoundLabel()}` : `Start ${calmSoundLabel()}`;
      btn.setAttribute('aria-label', btn.title);
    }

    function stopCalmSound() {
      calmAudioNodes.forEach(node => {
        try { if (typeof node.stop === 'function') node.stop(); } catch {}
        try { node.disconnect(); } catch {}
      });
      calmAudioNodes = [];
      if (calmMasterGain) {
        try { calmMasterGain.disconnect(); } catch {}
        calmMasterGain = null;
      }
      calmSoundOn = false;
      updateCalmSoundButton();
    }

    async function startCalmSound() {
      stopCalmSound();
      try {
        const ctx = await getCalmAudioContext();
        const master = ctx.createGain();
        calmMasterGain = master;

        if (data.soundMode === 'tone852') {
          const osc = ctx.createOscillator();
          osc.type = 'sine';
          osc.frequency.value = 852;
          master.gain.value = 0.018;
          osc.connect(master);
          master.connect(ctx.destination);
          osc.start();
          calmAudioNodes = [osc];
        } else if (data.soundMode === 'binaural10') {
          const leftOsc = ctx.createOscillator();
          const rightOsc = ctx.createOscillator();
          const leftGain = ctx.createGain();
          const rightGain = ctx.createGain();
          const merger = ctx.createChannelMerger(2);
          leftOsc.type = rightOsc.type = 'sine';
          leftOsc.frequency.value = 200;
          rightOsc.frequency.value = 210;
          leftGain.gain.value = 0.55;
          rightGain.gain.value = 0.55;
          master.gain.value = 0.028;
          leftOsc.connect(leftGain);
          rightOsc.connect(rightGain);
          leftGain.connect(merger, 0, 0);
          rightGain.connect(merger, 0, 1);
          merger.connect(master);
          master.connect(ctx.destination);
          leftOsc.start();
          rightOsc.start();
          calmAudioNodes = [leftOsc, rightOsc, leftGain, rightGain, merger];
        } else {
          const source = makeBrownNoiseSource(ctx);
          master.gain.value = 0.075;
          source.connect(master);
          master.connect(ctx.destination);
          source.start();
          calmAudioNodes = [source];
        }
        calmSoundOn = true;
        updateCalmSoundButton();
      } catch (err) {
        calmSoundOn = false;
        updateCalmSoundButton();
        alert('Your browser could not start the calm sound. Try opening the app in Safari and tap the sound button again.');
      }
    }

    function toggleCalmSound() {
      if (calmSoundOn) stopCalmSound();
      else startCalmSound();
    }
